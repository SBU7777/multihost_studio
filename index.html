<script type="module">
import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1.1.0/dist/kokoro.web.js";

var SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
var SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_PUBLIC_KEY_HERE";
var GEMINI_API_KEY = "PASTE_YOUR_GEMINI_KEY_HERE";
var ELEVEN_API_KEY = "";
var MODELS = ["gemini-2.5-flash","gemini-3.5-flash-lite","gemini-3.6-flash"];

(function(){
  var $ = function(s){ return document.querySelector(s); };
  var sb = null, kokoroTTS = null, kokoroLoading = false, audioContext = null, currentSource = null, activeAudioElement = null;

  function loadSettings(){ try{ return JSON.parse(localStorage.getItem("mhs_settings")||"{}"); }catch(e){ return {}; } }
  function saveSettings(o){ try{ localStorage.setItem("mhs_settings", JSON.stringify(o)); }catch(e){} }
  var SET = loadSettings();

  function notPlaceholder(v){ return v && v.indexOf("PASTE")!==0; }
  function gSupaUrl(){ return SET.supaUrl || (notPlaceholder(SUPABASE_URL) ? SUPABASE_URL : ""); }
  function gSupaKey(){ return SET.supaKey || (notPlaceholder(SUPABASE_ANON_KEY) ? SUPABASE_ANON_KEY : ""); }
  function gGemini(){ return SET.gemini || (notPlaceholder(GEMINI_API_KEY) ? GEMINI_API_KEY : ""); }
  function gEleven(){ return SET.eleven || ELEVEN_API_KEY || ""; }

  var customColors = SET.customColors || { bg:"#0A0F14", panel:"#1A2330", blue:"#00B2FF", gold:"#FFC107", text:"#D9D9D9" };
  var currentScale = SET.scale || "1";
  var currentTheme = SET.theme || "default";

  document.documentElement.style.setProperty("--scale", currentScale);
  $("#scaleSel").value = currentScale;
  $("#themeSel").value = currentTheme;
  $("#cpBg").value = customColors.bg;
  $("#cpPanel").value = customColors.panel;
  $("#cpBlue").value = customColors.blue;
  $("#cpGold").value = customColors.gold;
  $("#cpText").value = customColors.text;

  function applyCustomColors(){
    var root = document.documentElement;
    root.style.setProperty("--black", customColors.bg);
    root.style.setProperty("--input-bg", customColors.bg);
    root.style.setProperty("--navy", customColors.panel);
    root.style.setProperty("--card-bg", customColors.panel);
    root.style.setProperty("--blue", customColors.blue);
    root.style.setProperty("--gold", customColors.gold);
    root.style.setProperty("--gray", customColors.text);
    root.style.setProperty("--title-color", "#FFFFFF");
    root.style.setProperty("--sub-color", customColors.text);
  }

  function clearCustomColors(){
    var root = document.documentElement;
    ["--black","--input-bg","--navy","--card-bg","--blue","--gold","--gray","--title-color","--sub-color"].forEach(function(p){ root.style.removeProperty(p); });
  }

  function applyAppearance(){
    var scale = $("#scaleSel").value;
    var theme = $("#themeSel").value;
    document.documentElement.style.setProperty("--scale", scale);
    if(theme === "custom"){
      document.body.removeAttribute("data-theme");
      $("#customThemeBox").style.display = "block";
      applyCustomColors();
    } else {
      $("#customThemeBox").style.display = "none";
      clearCustomColors();
      if(theme === "default"){ document.body.removeAttribute("data-theme"); }
      else { document.body.setAttribute("data-theme", theme); }
    }
    SET.scale = scale; SET.theme = theme; SET.customColors = customColors;
    saveSettings(SET);
  }

  function onCustomColorInput(){
    customColors.bg = $("#cpBg").value; customColors.panel = $("#cpPanel").value;
    customColors.blue = $("#cpBlue").value; customColors.gold = $("#cpGold").value;
    customColors.text = $("#cpText").value;
    applyCustomColors(); SET.customColors = customColors; saveSettings(SET);
  }

  $("#cpBg").addEventListener("input", onCustomColorInput);
  $("#cpPanel").addEventListener("input", onCustomColorInput);
  $("#cpBlue").addEventListener("input", onCustomColorInput);
  $("#cpGold").addEventListener("input", onCustomColorInput);
  $("#cpText").addEventListener("input", onCustomColorInput);
  $("#scaleSel").addEventListener("change", applyAppearance);
  $("#themeSel").addEventListener("change", applyAppearance);

  $("#saveAppBtn").addEventListener("click", function(){
    applyAppearance();
    var btn = $("#saveAppBtn"); var orig = btn.textContent;
    btn.textContent = "Saved"; btn.style.color = "var(--gold)";
    setTimeout(function(){ btn.textContent = orig; btn.style.color = "var(--blue)"; }, 1500);
  });

  applyAppearance();

  function initSupa(){
    var url=gSupaUrl(), key=gSupaKey();
    if(url.indexOf("http")===0 && window.supabase){ try{ sb=window.supabase.createClient(url,key); }catch(e){ sb=null; } }
    else { sb=null; }
    return sb;
  }

  var SHOWS = [
    { id:"custom", name:"Custom or none", tone:"Write in a clear, warm, natural spoken style." },
    { id:"sbu", name:"Struggling Brothers United", tone:"Faith based brotherhood. Raw, honest, and grace centered, aware of Scripture but never preachy. Testimony driven, the kind of real talk that breaks silence and builds brotherhood." },
    { id:"nsp", name:"Neuro Static Pulse", tone:"Reflective and thoughtful, exploring the mind, meaning, and the signal underneath the noise. Curious and a little edgy, but grounded." },
    { id:"awl", name:"Accessibility Without Limits", tone:"Inclusion first. Frame everything through a disability and accessibility lens, practical and empowering, and note that the segment ships with captions and a transcript." },
    { id:"goofy", name:"The Goofy Business", tone:"Comedy and chaos, curated. Two co hosts riffing back and forth, chasing tangents, with at least one callback to the rubber chicken mascot." },
    { id:"grace", name:"Men of Grace", tone:"Grace centered and honest about falling short. Grounded in Scripture, gentle, real, and never preachy." }
  ];

  var VOICES = ["Warm, honest, welcoming, and encouraging","Warm baritone","Bright and energetic","Calm mentor","Gravelly and seasoned","Soft spoken","Youthful and quick","Custom"];

  var KOKORO_VOICES = [
    { id:"am_adam", name:"Adam (Warm & Honest Male - US)" },
    { id:"am_michael", name:"Michael (Smooth & Grounded Male - US)" },
    { id:"am_eric", name:"Eric (Authoritative Seasoned Male - US)" },
    { id:"am_onyx", name:"Onyx (Deep Baritone Male - US)" },
    { id:"am_fenrir", name:"Fenrir (Rich & Textured Male - US)" },
    { id:"am_liam", name:"Liam (Youthful & Energetic Male - US)" },
    { id:"am_echo", name:"Echo (Clear Narrator Male - US)" },
    { id:"am_puck", name:"Puck (Gritty Conversational Male - US)" },
    { id:"bm_george", name:"George (Distinguished Male - UK)" },
    { id:"bm_lewis", name:"Lewis (Calm Narrative Male - UK)" },
    { id:"bm_daniel", name:"Daniel (Clear Conversational Male - UK)" },
    { id:"bm_fable", name:"Fable (Storyteller Male - UK)" },
    { id:"af_bella", name:"Bella (Warm & Expressive Female - US)" },
    { id:"af_sarah", name:"Sarah (Calm & Clear Female - US)" },
    { id:"af_nicole", name:"Nicole (Rich Voice Female - US)" },
    { id:"af_heart", name:"Heart (Empathetic Female - US)" }
  ];

  var ELEVEN_PRESETS = [
    { id:"bIHbv24MWmeRgasZH58o", name:"Will (Relaxed Optimist)" },
    { id:"pNInz6obpgDQGcFmaJgB", name:"Adam (Dominant & Narrative)" },
    { id:"JBFqnCBsd6RMkjVDRZzb", name:"George (Warm & Engaging)" },
    { id:"IKne3meq5aSn9XLyUdCD", name:"Charlie (Australian Conversational)" },
    { id:"nPczCjzI2devNBz1zQrb", name:"Brian (Deep Baritone)" },
    { id:"EXAVITQu4vr4xnSDxMaL", name:"Bella (Warm & Expressive)" },
    { id:"custom", name:"Custom Voice ID (Paste below)" }
  ];

  var hostCount = 2, hosts = [], history = [];

  function defaultHost(i){
    var defaultKokoro = (i === 0) ? "am_adam" : (i === 1 ? "am_michael" : (i === 2 ? "am_eric" : "am_onyx"));
    return { name:"Host "+(i+1), persona:"", voice:VOICES[0], engine:"kokoro", kokoroVoice:defaultKokoro, elevenVoice:"bIHbv24MWmeRgasZH58o", customElevenId:"", rate:1, pitch:1 };
  }

  (function(){
    var sel = $("#showSel");
    SHOWS.forEach(function(s){ var o=document.createElement("option"); o.value=s.id; o.textContent=s.name; sel.appendChild(o); });
    sel.value = "sbu";
  })();

  (function(){
    var row = $("#seatRow");
    for(var n=1;n<=4;n++){
      (function(n){
        var b=document.createElement("button"); b.className="seatbtn"+(n===hostCount?" active":""); b.type="button"; b.textContent=n;
        b.addEventListener("click", function(){ setSeats(n); });
        row.appendChild(b);
      })(n);
    }
  })();

  function setSeats(n){
    hostCount=n;
    document.querySelectorAll(".seatbtn").forEach(function(b){ b.classList.toggle("active", parseInt(b.textContent,10)===n); });
    while(hosts.length<n){ hosts.push(defaultHost(hosts.length)); }
    hosts = hosts.slice(0,n);
    renderHosts();
  }

  function renderHosts(){
    var list=$("#hostList"); list.innerHTML="";
    hosts.forEach(function(h,i){
      var wrap=document.createElement("div"); wrap.className="host";
      var title=document.createElement("h3"); title.textContent="Seat "+(i+1); wrap.appendChild(title);
      var g=document.createElement("div"); g.className="grid2";
      g.appendChild(makeText("Name",h.name,function(v){ h.name=v; }));
      g.appendChild(makeVoiceTag(h)); wrap.appendChild(g);
      wrap.appendChild(makeEngineSelector(h));
      wrap.appendChild(makeVoiceControls(h));
      var pl=document.createElement("label"); pl.className="field"; pl.textContent="Persona and background"; wrap.appendChild(pl);
      var ta=document.createElement("textarea"); ta.rows=3; ta.placeholder="Who is this host? Their story and perspective.";
      ta.value=h.persona; ta.addEventListener("input", function(){ h.persona=ta.value; }); wrap.appendChild(ta);
      list.appendChild(wrap);
    });
  }

  function makeText(labelText,val,onChange){
    var box=document.createElement("div"); var l=document.createElement("label"); l.className="field"; l.textContent=labelText;
    var inp=document.createElement("input"); inp.type="text"; inp.value=val;
    inp.addEventListener("input", function(){ onChange(inp.value); });
    box.appendChild(l); box.appendChild(inp); return box;
  }

  function makeVoiceTag(h){
    var box=document.createElement("div"); var l=document.createElement("label"); l.className="field"; l.textContent="Tone style tag";
    var sel=document.createElement("select");
    VOICES.forEach(function(o){ var op=document.createElement("option"); op.value=o; op.textContent=o; sel.appendChild(op); });
    var custom=document.createElement("input"); custom.type="text"; custom.placeholder="Custom label"; custom.style.marginTop="10px";
    var known = VOICES.indexOf(h.voice) !== -1 && h.voice !== "Custom";
    if(known){ sel.value=h.voice; custom.style.display="none"; }
    else { sel.value="Custom"; custom.style.display="block"; custom.value=(h.voice==="Custom"?"":h.voice); }
    sel.addEventListener("change", function(){
      if(sel.value==="Custom"){ custom.style.display="block"; h.voice=custom.value.trim()||"Custom"; }
      else { custom.style.display="none"; h.voice=sel.value; }
    });
    custom.addEventListener("input", function(){ h.voice=custom.value.trim()||"Custom"; });
    box.appendChild(l); box.appendChild(sel); box.appendChild(custom);
    return box;
  }

  function makeEngineSelector(h){
    var wrap=document.createElement("div"); wrap.style.marginTop="14px";
    var l=document.createElement("label"); l.className="field"; l.textContent="Audio Engine & Voice Model"; wrap.appendChild(l);
    var g=document.createElement("div"); g.className="grid2";
    var engBox=document.createElement("div"); var engSel=document.createElement("select");
    var op1=document.createElement("option"); op1.value="kokoro"; op1.textContent="Kokoro AI (Free Browser Engine)"; engSel.appendChild(op1);
    var op2=document.createElement("option"); op2.value="eleven"; op2.textContent="ElevenLabs (Studio Quality API)"; engSel.appendChild(op2);
    engSel.value = h.engine || "kokoro"; engBox.appendChild(engSel); g.appendChild(engBox);

    var voiceConfigBox=document.createElement("div");
    var kokoroSelect=document.createElement("select");
    KOKORO_VOICES.forEach(function(kv){ var op=document.createElement("option"); op.value=kv.id; op.textContent=kv.name; kokoroSelect.appendChild(op); });
    kokoroSelect.value = h.kokoroVoice || "am_adam";

    var elevenSelect=document.createElement("select");
    ELEVEN_PRESETS.forEach(function(p){ var op=document.createElement("option"); op.value=p.id; op.textContent=p.name; elevenSelect.appendChild(op); });
    elevenSelect.value = h.elevenVoice || "bIHbv24MWmeRgasZH58o";

    var customIdInput=document.createElement("input"); customIdInput.type="text"; customIdInput.placeholder="Paste ElevenLabs Voice ID"; customIdInput.style.marginTop="8px";
    customIdInput.value = h.customElevenId || "";

    function refreshEngineUi(){
      if(engSel.value === "kokoro"){ kokoroSelect.style.display="block"; elevenSelect.style.display="none"; customIdInput.style.display="none"; }
      else { kokoroSelect.style.display="none"; elevenSelect.style.display="block"; customIdInput.style.display = (elevenSelect.value === "custom") ? "block" : "none"; }
    }
    engSel.addEventListener("change", function(){ h.engine=engSel.value; refreshEngineUi(); });
    kokoroSelect.addEventListener("change", function(){ h.kokoroVoice=kokoroSelect.value; });
    elevenSelect.addEventListener("change", function(){ h.elevenVoice=elevenSelect.value; customIdInput.style.display=(elevenSelect.value==="custom")?"block":"none"; });
    customIdInput.addEventListener("input", function(){ h.customElevenId=customIdInput.value.trim(); });
    refreshEngineUi();
    voiceConfigBox.appendChild(kokoroSelect); voiceConfigBox.appendChild(elevenSelect); voiceConfigBox.appendChild(customIdInput);
    g.appendChild(voiceConfigBox); wrap.appendChild(g); return wrap;
  }

  function slider(labelText, min, max, step, val, isSpeed, onChange){
    var wrap=document.createElement("div"); wrap.style.marginTop="12px";
    var top=document.createElement("div"); top.style.cssText="display:flex; justify-content:space-between; align-items:center;";
    var l=document.createElement("label"); l.className="field"; l.style.margin="0"; l.textContent=labelText;
    var valLab=document.createElement("span"); valLab.style.cssText="color:var(--gold); font-weight:700;";
    valLab.textContent = isSpeed ? (Number(val).toFixed(2)+"x") : Number(val).toFixed(2);
    top.appendChild(l); top.appendChild(valLab);
    var r=document.createElement("input"); r.type="range"; r.min=min; r.max=max; r.step=step; r.value=val;
    r.style.cssText="width:100%; min-height:40px; margin-top:6px;";
    r.addEventListener("input", function(){ var v=parseFloat(r.value); valLab.textContent = isSpeed ? (v.toFixed(2)+"x") : v.toFixed(2); onChange(v); });
    wrap.appendChild(top); wrap.appendChild(r); return wrap;
  }

  function makeVoiceControls(h){
    var box=document.createElement("div"); box.style.marginTop="12px";
    var hear=document.createElement("button"); hear.type="button"; hear.textContent="Hear sample voice";
    hear.style.cssText="min-height:44px; padding:0 20px; border-radius:10px; border:2px solid var(--blue); background:var(--input-bg); color:var(--blue); font-weight:700; font-family:'Raleway',sans-serif; cursor:pointer;";
    hear.addEventListener("click", function(){ sampleHostVoice(h); });
    box.appendChild(hear);
    box.appendChild(slider("Speed", 0.7, 1.3, 0.05, h.rate||1, true, function(v){ h.rate=v; }));
    return box;
  }

  function updateStatus(msg){ var box=$("#ttsStatus"); if(!msg){ box.style.display="none"; box.textContent=""; } else { box.style.display="block"; box.textContent=msg; } }
  function showErr(msg){ $("#errBox").innerHTML='<div class="err">'+msg+'</div>'; }
  function clearErr(){ $("#errBox").innerHTML=""; }

  function getEffectiveElevenVoiceId(h){ return (h.elevenVoice==="custom" && h.customElevenId) ? h.customElevenId : (h.elevenVoice||"bIHbv24MWmeRgasZH58o"); }

  async function ensureAudioContext(){
    if(!audioContext){
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioContext.state === "suspended"){
      await audioContext.resume();
    }
    return audioContext;
  }

  async function sampleHostVoice(h){
    clearErr();
    if(h.engine === "eleven"){
      var key = gEleven(); if(!key){ showErr("To test ElevenLabs voices, enter your key in Keys and Setup."); return; }
      var voiceId = getEffectiveElevenVoiceId(h); updateStatus("Generating ElevenLabs sample...");
      try{
        var res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+voiceId, {
          method:"POST", headers:{"Content-Type":"application/json","xi-api-key":key},
          body:JSON.stringify({ text:"Hey brother, this is how I sound at the table for your show.", model_id:"eleven_multilingual_v2", voice_settings:{stability:0.5,similarity_boost:0.75} })
        });
        if(!res.ok){ throw new Error("ElevenLabs API error: "+res.status); }
        var blob = await res.blob(); playAudioBlob(blob); updateStatus("");
      }catch(e){ updateStatus(""); showErr(e.message); }
    } else {
      var tts = await ensureKokoro(); if(!tts) return;
      updateStatus("Generating Kokoro sample...");
      try{
        var raw = await tts.generate("Hey brother, this is how I sound at the table for your show.", { voice:h.kokoroVoice||"am_adam", speed:h.rate||1 });
        await playRawAudio(raw);
        updateStatus("");
      }catch(e){ updateStatus(""); showErr("Sample error: "+e.message); }
    }
  }

  async function ensureKokoro(){
    if(kokoroTTS) return kokoroTTS;
    if(kokoroLoading) return null;
    kokoroLoading = true;
    updateStatus("Downloading Kokoro free neural engine into cache (first time only, ~90MB)...");
    try{
      kokoroTTS = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", { dtype:"q8", device:"wasm" });
      updateStatus("Kokoro voice engine ready."); setTimeout(function(){ updateStatus(""); }, 2000);
      kokoroLoading = false; return kokoroTTS;
    }catch(e){ kokoroLoading=false; showErr("Could not initialize Kokoro: "+e.message); return null; }
  }

  function playAudioBlob(blob){ stopSpeak(); var url=URL.createObjectURL(blob); activeAudioElement=new Audio(url); activeAudioElement.play(); }

  async function playRawAudio(rawAudio){
    stopSpeak();
    var ctx = await ensureAudioContext();
    var buffer = ctx.createBuffer(1, rawAudio.audio.length, rawAudio.sampling_rate);
    buffer.copyToChannel(rawAudio.audio, 0);
    currentSource = ctx.createBufferSource();
    currentSource.buffer = buffer;
    currentSource.connect(ctx.destination);
    currentSource.start();
  }

  /* ============ SAVED LINEUPS (Supabase) ============ */
  function renderSaveArea(){
    var area=$("#saveArea");
    if(!sb){ area.innerHTML='<div class="notice">Saving turns on as soon as your Supabase settings are active in Keys and Setup.</div>'; $("#lineupList").innerHTML=""; return; }
    area.innerHTML='<div class="saverow"><div><label class="field" for="lineupName">Name this lineup</label><input type="text" id="lineupName" placeholder="Example, SBU Adam and Michael Duo"></div><button id="saveBtn">Save lineup</button></div><div id="saveMsg"></div>';
    $("#saveBtn").addEventListener("click", saveLineup);
  }

  async function saveLineup(){
    var name=($("#lineupName").value||"").trim(); if(!name){ $("#saveMsg").innerHTML='<div class="err">Give the lineup a name first.</div>'; return; }
    var row={ name:name, show:$("#showSel").value, count:hostCount, hosts:hosts };
    try{
      var r=await sb.from("host_lineups").insert(row); if(r.error) throw new Error(r.error.message);
      $("#lineupName").value=""; $("#saveMsg").innerHTML='<div class="ok">Saved.</div>'; loadLineups();
    }catch(e){ $("#saveMsg").innerHTML='<div class="err">Could not save: '+e.message+'</div>'; }
  }

  async function loadLineups(){
    if(!sb) return;
    var list=$("#lineupList");
    try{
      var r=await sb.from("host_lineups").select("*").order("created_at",{ascending:false});
      if(r.error) throw new Error(r.error.message);
      var rows=r.data||[];
      if(!rows.length){ list.innerHTML='<div class="notice" style="margin-top:14px;">No saved lineups yet. Design a table above and save it.</div>'; return; }
      list.innerHTML="";
      rows.forEach(function(row){
        var showName=(SHOWS.filter(function(s){return s.id===row.show;})[0]||{}).name||"Custom";
        var el=document.createElement("div"); el.className="lineup";
        el.innerHTML='<span class="nm">'+escapeHtml(row.name)+'</span><span class="meta">'+row.count+' at table, '+escapeHtml(showName)+'</span>';
        var load=document.createElement("button"); load.className="load"; load.textContent="Load";
        load.addEventListener("click", function(){ applyLineup(row); });
        var del=document.createElement("button"); del.className="del"; del.textContent="Delete";
        del.addEventListener("click", function(){ deleteLineup(row.id); });
        el.appendChild(load); el.appendChild(del); list.appendChild(el);
      });
    }catch(e){ list.innerHTML='<div class="err">Could not load your lineups: '+e.message+'</div>'; }
  }

  function applyLineup(row){
    $("#showSel").value = row.show || "sbu";
    hosts = (row.hosts||[]).map(function(h, idx){
      var defaultKokoro = (idx === 0) ? "am_adam" : (idx === 1 ? "am_michael" : (idx === 2 ? "am_eric" : "am_onyx"));
      return { name:h.name||("Host "+(idx+1)), persona:h.persona||"", voice:h.voice||VOICES[0], engine:h.engine||"kokoro", kokoroVoice:h.kokoroVoice||defaultKokoro, elevenVoice:h.elevenVoice||"bIHbv24MWmeRgasZH58o", customElevenId:h.customElevenId||"", rate:h.rate||1, pitch:h.pitch||1 };
    });
    hostCount = row.count || hosts.length || 1;
    document.querySelectorAll(".seatbtn").forEach(function(b){ b.classList.toggle("active", parseInt(b.textContent,10)===hostCount); });
    renderHosts(); window.scrollTo({ top:0, behavior:"smooth" });
  }

  async function deleteLineup(id){
    if(!sb) return;
    try{ var r=await sb.from("host_lineups").delete().eq("id", id); if(r.error) throw new Error(r.error.message); loadLineups(); }
    catch(e){ $("#lineupList").innerHTML='<div class="err">Could not delete: '+e.message+'</div>'; }
  }

  function escapeHtml(s){ return (s||"").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  /* ============ THE WRITER ============ */
  var SYSTEM = [
    "You write podcast scripts as natural spoken conversation for audio production. Follow every rule exactly.",
    "Rule one. Never use the hyphen or dash character anywhere in your output, not the short hyphen, not the en dash, not the em dash. Replace them with commas, parentheses, or clean sentence breaks.",
    "Rule two. Write the way people actually talk out loud. Smooth cadence, clear phrasing, no formal jargon, no filler, no robotic transitions.",
    "Rule three. Label every spoken block with the exact host name followed by a colon. Use only the host names you are given. No narrator, no extra characters.",
    "Rule four. Keep each single spoken block between roughly 150 and 250 words so it chunks cleanly for voice production.",
    "Rule five. Stay fully in each host's persona and voice character. Do not add bracketed stage directions.",
    "Rule six. Keep every voice warm, honest, welcoming, and encouraging. The listener should feel welcomed, seen, and lifted, and always told the truth with kindness."
  ].join(" ");

  function buildBrief(){
    var show=SHOWS.filter(function(s){ return s.id===$("#showSel").value; })[0];
    var lines=[];
    lines.push("Show tone: "+show.tone); lines.push("Format: "+$("#formatSel").value); lines.push("Length: "+$("#lengthSel").value);
    lines.push(""); lines.push("Hosts at the table:");
    hosts.forEach(function(h,i){ var name=(h.name||("Host "+(i+1))).trim(); lines.push((i+1)+". "+name+". Voice: "+h.voice+". Persona: "+(h.persona.trim()||"none")); });
    lines.push(""); lines.push("Source material to build the episode from:");
    lines.push($("#sourceBox").value.trim() || "(open on show tone)"); lines.push("");
    lines.push(hosts.length===1 ? "Write this as a solo host." : "Write this as a real brotherhood conversation.");
    lines.push("Write the opening now. Start the script directly.");
    return lines.join("\n");
  }

  function setBusy(b){ $("#genBtn").disabled=b; if($("#moreBtn")) $("#moreBtn").disabled=b; $("#genBtn").textContent=b?"Writing...":"Write the episode"; }

  async function callWriter(messages){
    var key = gGemini(); if(!key) throw new Error("Please enter your Google Gemini key in Keys and Setup.");
    var contents=messages.map(function(m){ return { role:(m.role==="assistant"?"model":"user"), parts:[{ text:m.content }] }; });
    var body={ system_instruction:{ parts:[{ text:SYSTEM }] }, contents:contents };
    var lastErr="";
    for(var i=0;i<MODELS.length;i++){
      try{
        var res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODELS[i]+":generateContent?key="+encodeURIComponent(key), {
          method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
        });
        if(!res.ok){ lastErr="status "+res.status; continue; }
        var data=await res.json(); var cand=(data.candidates||[])[0];
        var text=cand && cand.content && cand.content.parts ? cand.content.parts.map(function(p){ return p.text||""; }).join("").trim() : "";
        if(text) return text;
      }catch(e){ lastErr=e.message; }
    }
    throw new Error("Could not reach writer: "+lastErr);
  }

  function renderScript(){
    var out=$("#output"); var full=history.filter(function(m){return m.role==="assistant";}).map(function(m){return m.content;}).join("\n\n");
    if(!full){ out.innerHTML='<p class="empty">Your generated conversation will show up here.</p>'; return; }
    var names=hosts.map(function(h){return (h.name||"").trim();}).filter(Boolean);
    var esc=escapeHtml(full); var lines=esc.split("\n"); var html="";
    lines.forEach(function(line){
      var matched=false;
      for(var i=0;i<names.length;i++){ var nm=names[i]; if(nm && line.indexOf(nm+":")===0){ html+='<span class="who">'+nm+'</span>'+line.slice(nm.length+1); matched=true; break; } }
      if(!matched) html+=line;
      html+="\n";
    });
    out.innerHTML='<div class="script">'+html+'</div>';
  }

  async function generate(fresh){
    clearErr();
    if(fresh){ history=[]; history.push({ role:"user", content:buildBrief() }); }
    else { history.push({ role:"user", content:"Continue the episode naturally from where it stopped. Keep each block 150 to 250 words and never use any dash or hyphen." }); }
    setBusy(true);
    try{ var reply=await callWriter(history); history.push({ role:"assistant", content:reply }); $("#toolbar").style.display="flex"; renderScript(); $("#output").scrollIntoView({ behavior:"smooth", block:"start" }); }
    catch(e){ showErr(e.message); }
    finally{ setBusy(false); }
  }

  $("#genBtn").addEventListener("click", function(){ generate(true); });
  $("#moreBtn").addEventListener("click", function(){ generate(false); });
  $("#clearBtn").addEventListener("click", function(){ history=[]; $("#toolbar").style.display="none"; clearErr(); renderScript(); });
  $("#copyBtn").addEventListener("click", function(){
    var full=history.filter(function(m){return m.role==="assistant";}).map(function(m){return m.content;}).join("\n\n");
    navigator.clipboard.writeText(full).then(function(){ var b=$("#copyBtn"); var t=b.textContent; b.textContent="Copied"; setTimeout(function(){ b.textContent=t; },1400); });
  });

  /* ============ FULL AUDIO PLAYBACK ============ */
  var speaking=false;

  function buildSegments(){
    var full=history.filter(function(m){return m.role==="assistant";}).map(function(m){return m.content;}).join("\n\n"); if(!full) return [];
    var hostMap={};
    hosts.forEach(function(h, idx){
      var nm=(h.name||("Host "+(idx+1))).trim();
      var defaultKokoro = (idx === 0) ? "am_adam" : (idx === 1 ? "am_michael" : (idx === 2 ? "am_eric" : "am_onyx"));
      hostMap[nm]={ engine:h.engine||"kokoro", kokoroVoice:h.kokoroVoice||defaultKokoro, elevenVoiceId:getEffectiveElevenVoiceId(h), rate:h.rate||1 };
    });
    var lines=full.split("\n"); var segs=[]; var currentSpeaker=Object.keys(hostMap)[0]||"Host 1";
    lines.forEach(function(line){
      var trimmed=line.trim(); if(!trimmed) return;
      for(var name in hostMap){ if(trimmed.indexOf(name+":")===0){ currentSpeaker=name; trimmed=trimmed.slice(name.length+1).trim(); break; } }
      if(trimmed){
        var info=hostMap[currentSpeaker]||{ engine:"kokoro", kokoroVoice:"am_adam", elevenVoiceId:"bIHbv24MWmeRgasZH58o", rate:1 };
        segs.push({ speaker:currentSpeaker, text:trimmed, engine:info.engine, kokoroVoice:info.kokoroVoice, elevenVoiceId:info.elevenVoiceId, rate:info.rate });
      }
    });
    return segs;
  }

  async function speakKokoro(){
    clearErr(); var segs=buildSegments(); if(!segs.length){ showErr("Write an episode first, then press Play."); return; }
    stopSpeak(); var tts=await ensureKokoro(); if(!tts) return;
    speaking=true; var ctx=await ensureAudioContext();
    for(var i=0;i<segs.length;i++){
      if(!speaking) break; var s=segs[i]; updateStatus("Speaking "+s.speaker+" ("+(i+1)+" of "+segs.length+")...");
      try{
        var raw=await tts.generate(s.text,{ voice:s.kokoroVoice, speed:s.rate });
        if(!speaking) break;
        await new Promise(function(resolve){
          var buffer=ctx.createBuffer(1,raw.audio.length,raw.sampling_rate); buffer.copyToChannel(raw.audio,0);
          currentSource=ctx.createBufferSource(); currentSource.buffer=buffer; currentSource.connect(ctx.destination);
          currentSource.onended=function(){ resolve(); }; currentSource.start();
        });
      }catch(e){ showErr("Kokoro issue: "+e.message); }
    }
    speaking=false; updateStatus("");
  }

  async function speakElevenLabs(){
    clearErr(); var key=gEleven(); if(!key){ showErr("Enter your ElevenLabs API key in Keys and Setup."); return; }
    var segs=buildSegments(); if(!segs.length){ showErr("Write an episode first, then press Play."); return; }
    stopSpeak(); speaking=true;
    for(var i=0;i<segs.length;i++){
      if(!speaking) break; var s=segs[i]; updateStatus("Speaking "+s.speaker+" ("+(i+1)+" of "+segs.length+")...");
      try{
        var res=await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+s.elevenVoiceId, {
          method:"POST", headers:{"Content-Type":"application/json","xi-api-key":key},
          body:JSON.stringify({ text:s.text, model_id:"eleven_multilingual_v2", voice_settings:{stability:0.5,similarity_boost:0.75} })
        });
        if(!res.ok) throw new Error("ElevenLabs error: "+res.status);
        var blob=await res.blob(); if(!speaking) break;
        await new Promise(function(resolve){
          var url=URL.createObjectURL(blob); activeAudioElement=new Audio(url);
          activeAudioElement.onended=function(){ resolve(); }; activeAudioElement.onerror=function(){ resolve(); }; activeAudioElement.play();
        });
      }catch(e){ showErr(e.message); break; }
    }
    speaking=false; updateStatus("");
  }

  function stopSpeak(){
    speaking=false;
    if(activeAudioElement){ try{ activeAudioElement.pause(); activeAudioElement.currentTime=0; }catch(e){} activeAudioElement=null; }
    if(currentSource){ try{ currentSource.stop(); }catch(e){} currentSource=null; }
    updateStatus("");
  }

  $("#playKokoroBtn").addEventListener("click", speakKokoro);
  $("#playElevenBtn").addEventListener("click", speakElevenLabs);
  $("#stopBtn").addEventListener("click", stopSpeak);

  /* ============ SETUP ============ */
  function setupField(labelText, val, k, isSecret){
    var box=document.createElement("div"); var l=document.createElement("label"); l.className="field"; l.textContent=labelText;
    var inp=document.createElement("input"); inp.type=isSecret?"password":"text"; inp.value=val||"";
    inp.setAttribute("data-k",k); box.appendChild(l); box.appendChild(inp); return box;
  }

  function renderSetup(){
    var box=$("#setupFields"); box.innerHTML="";
    box.appendChild(setupField("Supabase project URL", gSupaUrl(), "supaUrl", false));
    box.appendChild(setupField("Supabase anon public key", gSupaKey(), "supaKey", true));
    box.appendChild(setupField("Google Gemini key (free)", gGemini(), "gemini", true));
    box.appendChild(setupField("ElevenLabs API key (optional)", gEleven(), "eleven", true));
    var b=document.createElement("button"); b.textContent="Save keys";
    b.style.cssText="min-height:48px; padding:0 24px; margin-top:16px; border:none; border-radius:10px; font-weight:700; font-family:'Raleway',sans-serif; font-size:1rem; background:var(--blue); color:var(--btn-text); cursor:pointer;";
    b.addEventListener("click", function(){
      SET.supaUrl=(box.querySelector('[data-k="supaUrl"]').value||"").trim();
      SET.supaKey=(box.querySelector('[data-k="supaKey"]').value||"").trim();
      SET.gemini=(box.querySelector('[data-k="gemini"]').value||"").trim();
      SET.eleven=(box.querySelector('[data-k="eleven"]').value||"").trim();
      saveSettings(SET); initSupa(); renderSaveArea(); loadLineups();
      $("#setupMsg").innerHTML='<div class="ok">Saved. Your keys stay secure in this browser.</div>';
    });
    box.appendChild(b);
  }

  setSeats(2); renderSetup();
  var setupBox=$("#setupBox"); if(setupBox){ setupBox.open = !gGemini(); }
  initSupa(); renderSaveArea(); loadLineups();
})();
</script>
